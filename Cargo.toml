[package]
name = "elvm"
version = "0.2.0"
edition = "2021"
rust-version = "1.78"
license = "MIT"
description = "Version manager for the elephc compiler"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
fs2 = "0.4"
hex = "0.4"
indicatif = "0.17"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
thiserror = "2"

[dev-dependencies]
assert_cmd = "2"
httpmock = "0.7"
predicates = "3"

[profile.release]
strip = true
