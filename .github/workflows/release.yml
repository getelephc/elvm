name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="elvm-v${VERSION}-${{ matrix.target }}.tar.gz"
          tar czf "$NAME" -C "target/${{ matrix.target }}/release" elvm
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$NAME" > "$NAME.sha256"
          else
            sha256sum "$NAME" > "$NAME.sha256"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ matrix.target }}
          path: |
            elvm-*.tar.gz
            elvm-*.tar.gz.sha256
          if-no-files-found: error

  # A single job creates the release, once, from every leg's uploaded
  # assets. Three matrix legs each calling action-gh-release@v2 against the
  # same tag concurrently used to race the create path: create-or-update
  # usually tolerates it, but a 422 on the create could fail one leg and
  # publish only 4 of 6 assets, which then 404s install.sh for whichever
  # platform lost the race.
  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-assets-*
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
