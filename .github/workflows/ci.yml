name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: End-to-end compile with a real elephc
        if: matrix.os == 'macos-14'
        run: cargo test --test e2e_macos -- --ignored
      - name: Lint the installer
        if: runner.os == 'Linux'
        run: shellcheck -s sh install.sh
